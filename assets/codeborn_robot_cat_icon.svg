<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="103" y1="54" x2="916" y2="968" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142D58"/><stop offset=".48" stop-color="#07172F"/><stop offset="1" stop-color="#030A18"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="matrix(0 552 -552 0 512 452)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1266B8" stop-opacity=".55"/><stop offset=".58" stop-color="#0A3270" stop-opacity=".19"/><stop offset="1" stop-color="#07152C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="253" y1="263" x2="774" y2="772" gradientUnits="userSpaceOnUse">
      <stop stop-color="#667EAA"/><stop offset=".2" stop-color="#263D63"/><stop offset=".54" stop-color="#101E36"/><stop offset=".82" stop-color="#263B5D"/><stop offset="1" stop-color="#0A1528"/>
    </linearGradient>
    <linearGradient id="face" x1="325" y1="339" x2="698" y2="703" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142B49"/><stop offset=".5" stop-color="#08162A"/><stop offset="1" stop-color="#101F37"/>
    </linearGradient>
    <linearGradient id="ear" x1="344" y1="194" x2="415" y2="362" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26E8FF"/><stop offset=".48" stop-color="#1684F4"/><stop offset="1" stop-color="#715DFF"/>
